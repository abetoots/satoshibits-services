name: 🚀 Release using changesets

on:
  push:
    branches:
      - main

permissions: write-all

env:
  PNPM_CACHE_FOLDER: ${{ github.workspace }}/.pnpm-store
  # changesets/action presumes the .npmrc is in $HOME so it doesn't respect the project's .npmrc
  # actions/setup-node sets up a .npmrc in $HOME and sets it from env.NODE_AUTH_TOKEN
  # See:
  # - https://github.com/changesets/action/issues/58
  # - https://github.com/changesets/action/issues/147
  # - https://github.com/actions/setup-node/blob/78148dae5052c4942d5b0f92719061df122a3b1c/src/authutil.ts#L41

  NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

# Ensure that only a single job or workflow using the same concurrency group will run at a time
# This negates the need for styfle/cancel-workflow-action
concurrency:
  # Ensures that we process concurrently by branch using `github.ref` as the key
  group: ${{ github.workflow }}-${{ github.ref }}
  # If a run is in progress for a specific branch, cancel the current run and start a new run
  cancel-in-progress: true

jobs:
  release:
    name: 🚀 Build and release
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # the observability preload tests run the preset on Node 22 and Node 26 by these
      # binaries. Each setup puts its node first on PATH, so the runner's own node
      # directory is recorded here and put back in front once both are installed
      - run: echo "OBS_RUNNER_NODE_DIR=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"

      - name: ⎔ Setup node 22 for the observability preload tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: echo "OBS_TEST_NODE_22=$(command -v node)" >> "$GITHUB_ENV"

      - name: ⎔ Setup node 26 for the observability preload tests
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: echo "OBS_TEST_NODE_26=$(command -v node)" >> "$GITHUB_ENV"

      # the default node stays the runner's own for the setup step below and everything after
      - run: echo "$OBS_RUNNER_NODE_DIR" >> "$GITHUB_PATH"

      - name: ⎔ Setup node
        uses: actions/setup-node@v4

      - uses: actions/cache@v4
        name: ⚡️ Cache pnpm store
        with:
          path: ${{ env.PNPM_CACHE_FOLDER }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📥 Download deps
        run: pnpm install --prefer-offline

      - name: ⚡️ Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('packages/observability/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 🎭 Install Playwright Browsers for Observability
        run: pnpm --filter @satoshibits/observability exec playwright install --with-deps chromium

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "chore: update versions"
          title: "chore: update versions"
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish: pnpm run ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          # turbo builds every package before its tests here, so the preload tests use that dist/
          OBS_TEST_DIST_FRESH: "1"
